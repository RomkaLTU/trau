# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: trau

before:
  hooks:
    - go mod tidy
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: trau
    main: ./cmd/trau
    binary: trau
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: trau
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - package_name: trau
    formats: [deb, rpm]
    vendor: Codesomelabs
    homepage: "https://trau.sh"
    maintainer: "Codesomelabs <hello@codesomelabs.com>"
    description: "Autonomous, ticket-driven development loop"
    license: Apache-2.0
    section: devel
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/trau/LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"
  groups:
    - title: Epics
      regexp: '^.*?epic(\(.+\))??!?:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

homebrew_casks:
  - name: trau
    repository:
      owner: RomkaLTU
      name: homebrew-trau
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://trau.sh"
    description: "Autonomous, ticket-driven development loop"
    # trau is not (yet) Apple-notarized; strip the quarantine attribute on
    # install so the unsigned binary runs without a Gatekeeper prompt (ADR 0002 §6).
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/trau"]
          end

scoops:
  - name: trau
    repository:
      owner: RomkaLTU
      name: scoop-trau
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    directory: bucket
    homepage: "https://trau.sh"
    description: "Autonomous, ticket-driven development loop"
    license: Apache-2.0

winget:
  - name: trau
    package_identifier: Codesomelabs.trau
    publisher: Codesomelabs
    publisher_url: "https://trau.sh"
    publisher_support_url: "https://github.com/RomkaLTU/trau/issues"
    author: Codesomelabs
    short_description: "Autonomous, ticket-driven development loop"
    description: |
      trau pulls the next ready issue from your tracker and drives it through
      build, handoff, verify, commit, PR, CI and merge, one issue per iteration,
      each phase in its own fresh agent process.
    homepage: "https://trau.sh"
    license: Apache-2.0
    license_url: "https://github.com/RomkaLTU/trau/blob/main/LICENSE"
    release_notes_url: "https://github.com/RomkaLTU/trau/releases/tag/{{ .Tag }}"
    tags:
      - cli
      - developer-tools
      - automation
      - ai
    # Manifests are pushed to our own fork of winget-pkgs and land upstream as a
    # PR, so the channel goes live on Microsoft's review latency, not ours.
    repository:
      owner: RomkaLTU
      name: winget-pkgs
      branch: "trau-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

release:
  github:
    owner: RomkaLTU
    name: trau
  draft: false
  prerelease: auto
